<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Smart Medicine AI</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    font-family:Poppins,sans-serif;
    background:#eef5ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
    padding:20px;
    box-sizing:border-box;
}

.login-box{
    background:#ffffff;
    padding:30px;
    width:420px;
    max-width:100%;
    border-radius:18px;
    box-shadow:0 8px 20px rgba(0,0,0,0.12);
    box-sizing:border-box;
}

h1{
    text-align:center;
    color:#0d6efd;
    margin-top:0;
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.section-title{
    color:#0d6efd;
    font-size:18px;
    margin-top:20px;
    margin-bottom:8px;
    border-bottom:1px solid #dce8f8;
    padding-bottom:6px;
}

label{
    display:block;
    font-size:14px;
    font-weight:500;
    margin-top:10px;
    color:#333;
}

input{
    width:100%;
    padding:11px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

input:focus{
    outline:none;
    border-color:#0d6efd;
}

.medicine-row{
    display:grid;
    grid-template-columns:1fr 130px;
    gap:10px;
}

button{
    width:100%;
    padding:13px;
    margin-top:25px;
    background:#0d6efd;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-family:Poppins,sans-serif;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

@media(max-width:500px){

    .login-box{
        padding:22px;
    }

    .medicine-row{
        grid-template-columns:1fr;
        gap:0;
    }

}

</style>

</head>


<body>

<div class="login-box">

    <h1>
        <i class="fa-solid fa-pills"></i>
        Smart Medicine AI
    </h1>

    <p class="subtitle">
        Patient Registration
    </p>


    <!-- ================= PATIENT INFORMATION ================= -->

    <div class="section-title">
        Patient Information
    </div>

    <label>Patient Name</label>
    <input
        id="patientName"
        type="text"
        placeholder="Enter patient name"
    >

    <label>Age</label>
    <input
        id="patientAge"
        type="number"
        placeholder="Enter age"
    >

    <label>Gender</label>
    <input
        id="gender"
        type="text"
        placeholder="Enter gender"
    >

    <label>Blood Group</label>
    <input
        id="bloodGroup"
        type="text"
        placeholder="e.g. B+"
    >

    <label>Height</label>
    <input
        id="height"
        type="text"
        placeholder="Height in cm"
    >

    <label>Weight</label>
    <input
        id="weight"
        type="text"
        placeholder="Weight in kg"
    >

    <label>Disease</label>
    <input
        id="disease"
        type="text"
        placeholder="Enter disease"
    >

    <label>Doctor's Name</label>
    <input
        id="doctor"
        type="text"
        placeholder="Enter doctor's name"
    >


    <!-- ================= CAREGIVER ================= -->

    <div class="section-title">
        Caregiver Information
    </div>

    <label>Caregiver Name</label>
    <input
        id="caregiverName"
        type="text"
        placeholder="Enter caregiver name"
    >

    <label>Caregiver Mobile Number</label>
    <input
        id="caregiverNumber"
        type="tel"
        placeholder="Enter mobile number"
    >


    <!-- ================= MEDICINES ================= -->

    <div class="section-title">
        Medicine Information
    </div>


    <!-- MEDICINE 1 -->

    <label>Medicine 1</label>

    <div class="medicine-row">

        <input
            id="medicine1"
            type="text"
            placeholder="Medicine name"
        >

        <input
            id="medicine1Time"
            type="time"
        >

    </div>


    <!-- MEDICINE 2 -->

    <label>Medicine 2</label>

    <div class="medicine-row">

        <input
            id="medicine2"
            type="text"
            placeholder="Medicine name"
        >

        <input
            id="medicine2Time"
            type="time"
        >

    </div>


    <!-- MEDICINE 3 -->

    <label>Medicine 3</label>

    <div class="medicine-row">

        <input
            id="medicine3"
            type="text"
            placeholder="Medicine name"
        >

        <input
            id="medicine3Time"
            type="time"
        >

    </div>


    <!-- ================= BUTTON ================= -->

    <button onclick="loginUser()">
        <i class="fa-solid fa-arrow-right"></i>
        Continue to Dashboard
    </button>

</div>


<script>

function loginUser(){

    const ids = [

        "patientName",
        "patientAge",
        "gender",
        "bloodGroup",
        "height",
        "weight",
        "disease",
        "doctor",

        "caregiverName",
        "caregiverNumber",

        "medicine1",
        "medicine1Time",

        "medicine2",
        "medicine2Time",

        "medicine3",
        "medicine3Time"

    ];


    // Save all information

    for(const id of ids){

        const element = document.getElementById(id);

        localStorage.setItem(
            id,
            element.value.trim()
        );

    }


    // Open dashboard

    window.location.href = "dashboard.html";

}

</script>

</body>

</html>
