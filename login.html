<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Smart Medicine AI</title>

<link rel="stylesheet" href="css/style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#eef5ff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px 0;
}

.login-box{
    width:430px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.login-box h1{
    text-align:center;
    color:#0d6efd;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:500;
    color:#333;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #d9d9d9;
    border-radius:8px;
    font-size:15px;
    outline:none;
    transition:.3s;
}

.input-group input:focus{
    border-color:#0d6efd;
    box-shadow:0 0 5px rgba(13,110,253,.3);
}

.section-title{
    margin-top:25px;
    margin-bottom:15px;
    padding-bottom:8px;
    border-bottom:2px solid #eef5ff;
    color:#0d6efd;
    font-size:18px;
    font-weight:600;
}

.login-btn{
    width:100%;
    padding:14px;
    background:#0d6efd;
    color:#fff;
    font-size:16px;
    font-weight:600;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

.login-btn:hover{
    background:#0b5ed7;
}

</style>

</head>


<body>


<div class="login-box">


<h1>

<i class="fa-solid fa-pills"></i>

Smart Medicine AI

</h1>


<p>
Patient Registration
</p>



<!-- ================= PATIENT INFORMATION ================= -->

<div class="section-title">
Patient Information
</div>


<div class="input-group">

<label>
Patient Name
</label>

<input
type="text"
id="patientName"
placeholder="Enter Patient Name">

</div>


<div class="input-group">

<label>
Age
</label>

<input
type="number"
id="patientAge"
placeholder="Enter Age">

</div>


<div class="input-group">

<label>
Gender
</label>

<input
type="text"
id="gender"
placeholder="Male / Female">

</div>


<div class="input-group">

<label>
Blood Group
</label>

<input
type="text"
id="bloodGroup"
placeholder="Example: B+">

</div>


<div class="input-group">

<label>
Height (cm)
</label>

<input
type="number"
id="height"
placeholder="Enter Height">

</div>


<div class="input-group">

<label>
Weight (kg)
</label>

<input
type="number"
id="weight"
placeholder="Enter Weight">

</div>


<div class="input-group">

<label>
Disease
</label>

<input
type="text"
id="disease"
placeholder="Example: Alzheimer's Disease">

</div>



<!-- ================= DOCTOR ================= -->

<div class="section-title">
Doctor Information
</div>


<div class="input-group">

<label>
Doctor Name
</label>

<input
type="text"
id="doctor"
placeholder="Enter Doctor Name">

</div>



<!-- ================= THREE MEDICINES ================= -->

<div class="section-title">
Medicine Information
</div>


<!-- MEDICINE 1 -->

<div class="input-group">

<label>
Medicine 1
</label>

<input
type="text"
id="medicine1"
placeholder="Example: BP Tablet">

</div>


<div class="input-group">

<label>
Medicine 1 Time
</label>

<input
type="time"
id="medicine1Time">

</div>


<!-- MEDICINE 2 -->

<div class="input-group">

<label>
Medicine 2
</label>

<input
type="text"
id="medicine2"
placeholder="Example: Vitamin D">

</div>


<div class="input-group">

<label>
Medicine 2 Time
</label>

<input
type="time"
id="medicine2Time">

</div>


<!-- MEDICINE 3 -->

<div class="input-group">

<label>
Medicine 3
</label>

<input
type="text"
id="medicine3"
placeholder="Example: Memory Tablet">

</div>


<div class="input-group">

<label>
Medicine 3 Time
</label>

<input
type="time"
id="medicine3Time">

</div>



<!-- ================= CAREGIVER ================= -->

<div class="section-title">
Caregiver Information
</div>


<div class="input-group">

<label>
Caregiver Name
</label>

<input
type="text"
id="caregiverName"
placeholder="Enter Caregiver Name">

</div>


<div class="input-group">

<label>
Caregiver Mobile Number
</label>

<input
type="tel"
id="caregiverNumber"
placeholder="Enter Mobile Number">

</div>



<!-- ================= LOGIN BUTTON ================= -->

<button
class="login-btn"
onclick="loginUser()">

<i class="fa-solid fa-right-to-bracket"></i>

Register & Continue

</button>


</div>



<script>

function loginUser(){

/* ================= PATIENT INFORMATION ================= */

localStorage.setItem(
    "patientName",
    document.getElementById("patientName").value
);

localStorage.setItem(
    "patientAge",
    document.getElementById("patientAge").value
);

localStorage.setItem(
    "gender",
    document.getElementById("gender").value
);

localStorage.setItem(
    "bloodGroup",
    document.getElementById("bloodGroup").value
);

localStorage.setItem(
    "height",
    document.getElementById("height").value
);

localStorage.setItem(
    "weight",
    document.getElementById("weight").value
);

localStorage.setItem(
    "disease",
    document.getElementById("disease").value
);


/* ================= DOCTOR ================= */

localStorage.setItem(
    "doctor",
    document.getElementById("doctor").value
);


/* ================= MEDICINE 1 ================= */

localStorage.setItem(
    "medicine1",
    document.getElementById("medicine1").value
);

localStorage.setItem(
    "medicine1Time",
    document.getElementById("medicine1Time").value
);


/* ================= MEDICINE 2 ================= */

localStorage.setItem(
    "medicine2",
    document.getElementById("medicine2").value
);

localStorage.setItem(
    "medicine2Time",
    document.getElementById("medicine2Time").value
);


/* ================= MEDICINE 3 ================= */

localStorage.setItem(
    "medicine3",
    document.getElementById("medicine3").value
);

localStorage.setItem(
    "medicine3Time",
    document.getElementById("medicine3Time").value
);


/* ================= CAREGIVER ================= */

localStorage.setItem(
    "caregiverName",
    document.getElementById("caregiverName").value
);

localStorage.setItem(
    "caregiverNumber",
    document.getElementById("caregiverNumber").value
);


alert("Registration Successful!");


window.location.href =
    "dashboard.html";

}

</script>


</body>

</html>
