<div class="patient-grid">


<div>
<strong>Name:</strong>
<span id="caregiverName">Not Added</span>

<div>
<strong>Mobile:</strong>
<span id="caregiverNumber">Not Added</span>
</div>

</button>

<script src="js/script.js"></script>



<script>


window.onload=function(){


let name=localStorage.getItem("caregiverName");

let number=localStorage.getItem("caregiverNumber");


if(name){

document.getElementById("caregiverName").innerHTML=name;

}


if(number){

document.getElementById("caregiverNumber").innerHTML=number;

}


}



function callCaregiver(){


let number=localStorage.getItem("caregiverNumber");


if(number){

window.location.href="tel:"+number;

}

else{

alert("Please add caregiver number first");

}


}



function sendSMS(){


let number=localStorage.getItem("caregiverNumber");


if(number){

window.location.href=
"sms:"+number+"?body=Patient needs assistance.";

}

else{

alert("Please add caregiver number first");

}


}


</script>
