<script src="js/script.js"></script>


<script>

function loadMedicines(){

    const name =
        localStorage.getItem(
            "patientName"
        ) || "Patient";


    document.getElementById(
        "topPatientName"
    ).textContent = name;



    const medicines =
        getMedicines();


    const takenData =
        getTakenMedicines();


    const today =
        todayDate();


    const table =
        document.getElementById(
            "medicineTableBody"
        );


    table.innerHTML = "";


    medicines.forEach(
        function(medicine){

            const taken =
                takenData[today] &&
                takenData[today][medicine.id];


            const row =
                document.createElement("tr");


            row.innerHTML =

                "<td>" +
                medicine.name +
                "</td>" +

                "<td>1 Tablet</td>" +

                "<td>" +
                formatMedicineTime(
                    medicine.time
                ) +
                "</td>" +

                "<td class='medicine-status'>" +

                (
                    taken

                    ?

                    '<span class="status-taken">✔ Taken</span>'

                    :

                    '<span class="status-pending">⏰ Pending</span>'
                )

                +

                "</td>" +

                "<td>" +

                (
                    taken

                    ?

                    '<button class="untake-btn" onclick="undoMedicine(\'' +
                    medicine.id +
                    '\')">Untake</button>'

                    :

                    '<button class="take-btn" onclick="takeMedicine(\'' +
                    medicine.id +
                    '\')">Take</button>'
                )

                +

                "</td>";


            table.appendChild(row);

        }
    );

}


function takeMedicine(id){

    markMedicineTaken(id);

    loadMedicines();

}


function undoMedicine(id){

    const medicines =
        getMedicines();


    const medicine =
        medicines.find(
            function(m){
                return m.id === id;
            }
        );


    const medicineName =
        medicine
        ? medicine.name
        : "this medicine";


    if(
        !confirm(
            "Mark " +
            medicineName +
            " as NOT TAKEN?"
        )
    ){

        return;

    }


    unTakeMedicine(id);

    loadMedicines();

}


document.getElementById(
    "medicineSearch"
).addEventListener(
    "input",
    function(){

        const search =
            this.value
            .toLowerCase()
            .trim();


        document.querySelectorAll(
            "#medicineTableBody tr"
        ).forEach(
            function(row){

                const name =
                    row.cells[0]
                    ?.textContent
                    .toLowerCase()
                    || "";


                row.style.display =
                    name.includes(search)
                    ? ""
                    : "none";

            }
        );

    }
);


document.addEventListener(
    "DOMContentLoaded",
    loadMedicines
);


window.addEventListener(
    "medicineStatusChanged",
    loadMedicines
);


window.addEventListener(
    "storage",
    loadMedicines
);

</script>
